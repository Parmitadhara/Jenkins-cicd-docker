<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BiteDash | Express Food Delivery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🚀 BiteDash Express Food Delivery</h1>
    <p>Containerized Dynamic Web Application</p>
  </header>

  <main class="container">
    <!-- Food Menu Section -->
    <section class="menu-section">
      <h2>Menu</h2>
      <div id="menu-grid" class="menu-grid">Loading menu items...</div>
    </section>

    <!-- Cart & Order Summary Section -->
    <section class="cart-section">
      <h2>Your Order</h2>
      <div id="cart-items">Cart is empty</div>
      <hr />
      <h3>Total: $<span id="total-price">0.00</span></h3>
      <button id="checkout-btn" onclick="placeOrder()" disabled>Place Order</button>
      <div id="order-status" class="status-msg"></div>
    </section>
  </main>

  <script>
    let cart = [];
    let menu = [];

    // Fetch Menu dynamically from Express API
    async function fetchMenu() {
      try {
        const response = await fetch('/api/menu');
        const data = await response.json();
        menu = data.menu;
        renderMenu();
      } catch (err) {
        document.getElementById('menu-grid').innerText = 'Failed to load menu.';
      }
    }

    function renderMenu() {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = menu.map(item => `
        <div class="card">
          <div class="emoji">${item.image}</div>
          <h3>${item.name}</h3>
          <p class="category">${item.category}</p>
          <p class="price">$${item.price.toFixed(2)}</p>
          <button onclick="addToCart(${item.id})">Add to Cart</button>
        </div>
      `).join('');
    }

    function addToCart(itemId) {
      const item = menu.find(i => i.id === itemId);
      cart.push(item);
      updateCart();
    }

    function updateCart() {
      const cartDiv = document.getElementById('cart-items');
      const totalSpan = document.getElementById('total-price');
      const checkoutBtn = document.getElementById('checkout-btn');

      if (cart.length === 0) {
        cartDiv.innerText = 'Cart is empty';
        totalSpan.innerText = '0.00';
        checkoutBtn.disabled = true;
        return;
      }

      cartDiv.innerHTML = cart.map(item => `
        <div class="cart-item">
          <span>${item.image} ${item.name}</span>
          <span>$${item.price.toFixed(2)}</span>
        </div>
      `).join('');

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      totalSpan.innerText = total.toFixed(2);
      checkoutBtn.disabled = false;
    }

    // Submit Order to Backend API
    async function placeOrder() {
      const statusDiv = document.getElementById('order-status');
      const total = cart.reduce((sum, item) => sum + item.price, 0);

      statusDiv.innerText = 'Processing order...';

      try {
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            items: cart,
            totalAmount: total,
            customerName: 'DevOps Engineer'
          })
        });

        const result = await response.json();

        if (result.success) {
          statusDiv.innerHTML = `<span style="color: green;">✅ ${result.message} ID: <strong>${result.order.orderId}</strong></span>`;
          cart = [];
          updateCart();
        } else {
          statusDiv.innerHTML = `<span style="color: red;">❌ ${result.message}</span>`;
        }
      } catch (err) {
        statusDiv.innerHTML = '<span style="color: red;">❌ Error sending order to server.</span>';
      }
    }

    fetchMenu();
  </script>
</body>
</html>
